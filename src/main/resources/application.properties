spring.application.name=casita
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:mem:casita;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.h2.console.enabled=false

spring.ai.openai.api-key=${OPENAI_API_KEY:missing-openai-api-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5-mini}
spring.ai.openai.chat.options.temperature=1

logging.level.org.springframework.ai=WARN
